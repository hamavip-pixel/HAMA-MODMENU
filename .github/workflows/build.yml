name: HAMA VIP Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Verify Theos
        run: |
          test -f "$THEOS/makefiles/common.mk"
          echo "Theos installed successfully"

      - name: Build
        run: |
          make package

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-VIP-Build
          path: packages/*
          if-no-files-found: error
